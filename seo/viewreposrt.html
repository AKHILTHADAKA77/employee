<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Social Media Report Builder</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<style>
body {
  background: #f5f7fa;
  padding: 30px;
}

.card {
  border-radius: 18px;
  box-shadow: 0 6px 25px rgba(0,0,0,0.1);
}

.entry-card {
  background: #ffffff;
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 15px;
  border-left: 6px solid #4e73df;
}

.remove-entry-btn {
  float: right;
  cursor: pointer;
  color: red;
  font-weight: bold;
  font-size: 1.3rem;
}

.platform-icon {
  font-size: 1.5rem;
  margin-right: 8px;
}
</style>

</head>
<body>

<div class="container">
  <div class="card p-4">
    <h2 class="mb-3"><b>📊 Social Media Report Entry</b></h2>

    <!-- Client Selector -->
    <div class="mb-4">
      <label class="form-label fw-bold">Select Client</label>
      <select id="clientSelect" class="form-select">
        <option value="">Choose Client</option>
        <option>Client A</option>
        <option>Client B</option>
        <option>Client C</option>
        <option>Client D</option>
        <option>Client E</option>
      </select>
    </div>

    <hr>

    <!-- Entries Container -->
    <h4 class="mb-3">📌 Platform Activity</h4>
    <div id="entriesContainer"></div>

    <!-- Add Entry Btn -->
    <button class="btn btn-primary mb-4" id="addEntryBtn">➕ Add Platform Entry</button>

    <!-- Submit -->
    <button class="btn btn-success w-100" id="submitBtn">Submit Report</button>
  </div>
</div>


<!-- Summary Modal -->
<div class="modal fade" id="summaryModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content p-3">
      <div class="modal-header">
        <h5 class="modal-title">Report Summary</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="summaryOutput"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>

function createEntryCard(index) {
  return `
    <div class="entry-card" data-entry="${index}">
      
      <span class="remove-entry-btn">&times;</span>
      
      <h5><b>Entry #${index}</b></h5>

      <div class="row g-3">
        
        <!-- Platform -->
        <div class="col-md-6">
          <label class="form-label">Platform</label>
          <select class="form-select platform">
            <option>Facebook</option>
            <option>Instagram</option>
            <option>YouTube</option>
            <option>Telegram</option>
            <option>Twitter</option>
          </select>
        </div>

        <!-- Likes -->
        <div class="col-md-6">
          <label class="form-label">Likes 👍</label>
          <input type="number" class="form-control likes" min="0" value="0">
        </div>

        <!-- Shares -->
        <div class="col-md-6">
          <label class="form-label">Shares 🔁</label>
          <input type="number" class="form-control shares" min="0" value="0">
        </div>

        <!-- Forwards -->
        <div class="col-md-6">
          <label class="form-label">Forwards 📤</label>
          <input type="number" class="form-control forwards" min="0" value="0">
        </div>

        <!-- Reach -->
        <div class="col-md-6">
          <label class="form-label">Reach 👁️</label>
          <input type="number" class="form-control reach" min="0" value="0">
        </div>

        <!-- Followers -->
        <div class="col-md-6">
          <label class="form-label">Followers 👥</label>
          <input type="number" class="form-control followers" min="0" value="0">
        </div>
      
      </div>
    </div>`;
}

function renumberCards() {
  $(".entry-card").each(function(index){
    $(this).find("h5").text(`Entry #${index + 1}`);
    $(this).attr("data-entry", index + 1);
  });
}

$("#addEntryBtn").click(function(){
  const index = $(".entry-card").length + 1;
  $("#entriesContainer").append(createEntryCard(index));
});

$(document).on("click", ".remove-entry-btn", function(){
  $(this).closest(".entry-card").remove();
  renumberCards();
});

// Submit
$("#submitBtn").click(function(){

  let client = $("#clientSelect").val();
  if (!client) {
    alert("Please select a client first!");
    return;
  }

  let entries = [];

  $(".entry-card").each(function(){

    entries.push({
      platform: $(this).find(".platform").val(),
      likes: $(this).find(".likes").val(),
      shares: $(this).find(".shares").val(),
      forwards: $(this).find(".forwards").val(),
      reach: $(this).find(".reach").val(),
      followers: $(this).find(".followers").val(),
    });

  });

  if (entries.length === 0) {
    alert("Please add at least one platform entry!");
    return;
  }

  // Create Summary HTML
  let html = `
    <h5><b>Client:</b> ${client}</h5>
    <p>Total Entries: <b>${entries.length}</b></p>
    <hr>
  `;

  entries.forEach((e, i) => {
    html += `
      <div class="border p-3 rounded mb-3">
        <h6><b>Entry #${i+1}</b> — ${e.platform}</h6>
        <p>Likes: ${e.likes}</p>
        <p>Shares: ${e.shares}</p>
        <p>Forwards: ${e.forwards}</p>
        <p>Reach: ${e.reach}</p>
        <p>Followers: ${e.followers}</p>
      </div>
    `;
  });

  $("#summaryOutput").html(html);
  new bootstrap.Modal(document.getElementById('summaryModal')).show();

});

</script>

</body>
</html>
