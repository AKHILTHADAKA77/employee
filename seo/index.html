<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Cards with Bootstrap</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <style>
        body {
            font-family: "Poppins", sans-serif;
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            padding: 40px;
        }

        .card-custom {
            padding: 25px;
            border-radius: 20px;
            background: #fff;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
        }

        .icon-box {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 18px;
            color: white;
            font-size: 32px;
        }

        .purple {
            background: linear-gradient(135deg, #7b61ff, #5a3bff);
        }

        .pink {
            background: linear-gradient(135deg, #ff7ac4, #ff4e9b);
        }

        h2 {
            margin: 0;
            font-size: 22px;
            color: #1f1f1f;
        }

        p {
            margin-top: 10px;
            color: #666;
            font-size: 14px;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            color: white !important;
            font-size: 15px;
            cursor: pointer;
            background: linear-gradient(135deg, #6e8efb, #7b61ff);
        }

        .btn-pink {
            background: linear-gradient(135deg, #ff4e9b, #ff7ac4);
        }

        button a {
            text-decoration: none;
            color: white;
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row g-4">

        <!-- Client Report Card -->
        <div class="col-md-4 col-lg-3">
            <div class="card-custom">
                <div class="icon-box purple">
                    <span class="material-icons">description</span>
                </div>
                <h2>Client Report</h2>
                <p>Manage and review your client reports.</p>
                <button>
                    <a href="#">View Report</a>
                </button>
            </div>
        </div>

        <!-- Worksheet Card -->
        <div class="col-md-4 col-lg-3">
            <div class="card-custom">
                <div class="icon-box pink">
                    <span class="material-icons">assignment</span>
                </div>
                <h2>Worksheet</h2>
                <p>Access and edit your worksheets easily.</p>
                <button class="btn-pink">
                    <a href="#">Open Worksheet</a>
                </button>
            </div>
        </div>

    </div>
</div>

</body>
</html>
