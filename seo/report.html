<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Deliverables Tracker</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    .success-popup {
        display: none;
        position: fixed;
        top: 20px;
        right: 20px;
        background: #198754;
        color: white;
        padding: 15px 20px;
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        z-index: 9999;
    }
</style>
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="card shadow-sm">
        <div class="card-body">

            <h3 class="text-center mb-4">Deliverables Completion Form</h3>

            <form id="deliverForm">

                <!-- Select Client -->
                <div class="mb-3">
                    <label class="form-label">Select Client</label>
                    <select id="clientSelect" class="form-select" required>
                        <option value="">Choose...</option>
                        <option value="1">Client 1</option>
                        <option value="2">Client 2</option>
                        <option value="3">Client 3</option>
                        <option value="4">Client 4</option>
                        <option value="5">Client 5</option>
                        <option value="6">Client 6</option>
                    </select>
                </div>

                <!-- Deliverables Area (Auto Fill Based on Client) -->
                <div id="deliverablesBox" class="p-3 border rounded bg-white mb-3" style="display:none;">
                    <h5 class="mb-3">Deliverables</h5>

                    <div id="deliverablesContent"></div>
                </div>

                <!-- Completed Inputs -->
                <h5 class="mt-4">Enter Completed Counts</h5>

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Completed Posters</label>
                        <input type="number" min="0" class="form-control" id="completedPoster">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Completed Videos / GIFs</label>
                        <input type="number" min="0" class="form-control" id="completedVideo">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Completed Flyers</label>
                        <input type="number" min="0" class="form-control" id="completedFlyers">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Completed Festival Posters</label>
                        <input type="number" min="0" class="form-control" id="completedFestival">
                    </div>

                </div>

                <button class="btn btn-primary w-100 mt-4">Submit</button>

            </form>

        </div>
    </div>
</div>

<!-- Success Popup -->
<div id="successPopup" class="success-popup">✔ Data Submitted Successfully!</div>

<script>
const clientData = {
    1: {
        deliverables: "1 Customised Poster; Daily Updates",
        details: "Brand poster + daily posts",
        available: 1
    },
    2: {
        deliverables: "1 Video/GIF; Unlimited Flyers; Daily Updates",
        details: "Promo video + flyers",
        available: 1
    },
    3: {
        deliverables: "2 Festival Posters; Unlimited postings; weekly reports",
        details: "Festival creative + posts",
        available: 2
    },
    4: {
        deliverables: "1 Customised Poster; Daily Updates",
        details: "Brand poster + daily posts",
        available: 1
    },
    5: {
        deliverables: "1 Video/GIF; Unlimited Flyers; Daily Updates",
        details: "Promo video + flyers",
        available: 1
    },
    6: {
        deliverables: "2 Festival Posters; Unlimited postings; weekly reports",
        details: "Festival creative + posts",
        available: 2
    }
};

document.getElementById("clientSelect").addEventListener("change", function () {
    let clientId = this.value;

    if (clientId) {
        document.getElementById("deliverablesBox").style.display = "block";

        let data = clientData[clientId];

        document.getElementById("deliverablesContent").innerHTML = `
            <p><b>Deliverables:</b> ${data.deliverables}</p>
            <p><b>Details:</b> ${data.details}</p>
            <p><b>Available:</b> ${data.available}</p>
        `;
    }
});

// Submit Form
document.getElementById("deliverForm").addEventListener("submit", function(e) {
    e.preventDefault();

    let popup = document.getElementById("successPopup");
    popup.style.display = "block";

    setTimeout(() => {
        popup.style.display = "none";
        document.getElementById("deliverForm").reset();
        document.getElementById("deliverablesBox").style.display = "none";
    }, 2000);
});
</script>

</body>
</html>
