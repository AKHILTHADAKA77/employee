<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Social Media Report Builder</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<style>
body { background: #f5f7fa; padding: 30px; }
.card { border-radius: 18px; box-shadow: 0 6px 25px rgba(0,0,0,0.1); }
.entry-card { background: #ffffff; border-radius: 14px; padding: 20px; margin-bottom: 15px; border-left: 6px solid #4e73df; }
/* Toast container styling */
#toastContainer {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 1055;
}
</style>
</head>
<body>
<div class="container">
  <div class="card p-4">
    <h2 class="mb-3"><b>📊 Social Media Report Entry</b></h2>
    <!-- Client Selector -->
    <div class="mb-4">
      <label class="form-label fw-bold">Select Client</label>
      <select id="clientSelect" class="form-select">
        <option value="">Choose Client</option>
        <option>Client A</option>
        <option>Client B</option>
        <option>Client C</option>
        <option>Client D</option>
        <option>Client E</option>
      </select>
    </div>
    <hr>
    <!-- Entries Container -->
    <h4 class="mb-3">📌 Platform Activity</h4>
    <div id="entriesContainer"></div>

    <!-- Submit -->
    <button class="btn btn-success w-100" id="submitBtn">Submit Report</button>
  </div>
</div>

<!-- Toast Container -->
<div id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
function createEntryCard(index) {
  return `
    <div class="entry-card" data-entry="${index}">
      <h5><b>Entry #${index}</b></h5>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Platform</label>
          <select class="form-select platform">
            <option>Facebook</option>
            <option>Instagram</option>
            <option>YouTube</option>
            <option>Telegram</option>
            <option>Twitter</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Likes 👍</label>
          <input type="number" class="form-control likes" min="0" value="0">
        </div>
        <div class="col-md-6">
          <label class="form-label">Shares 🔁</label>
          <input type="number" class="form-control shares" min="0" value="0">
        </div>
        <div class="col-md-6">
          <label class="form-label">Forwards 📤</label>
          <input type="number" class="form-control forwards" min="0" value="0">
        </div>
        <div class="col-md-6">
          <label class="form-label">Reach 👁️</label>
          <input type="number" class="form-control reach" min="0" value="0">
        </div>
        <div class="col-md-6">
          <label class="form-label">Followers 👥</label>
          <input type="number" class="form-control followers" min="0" value="0">
        </div>
      </div>
    </div>
  `;
}

// Add default entry on page load
$(document).ready(function(){
  $("#entriesContainer").append(createEntryCard(1));
});

// Submit button action
$("#submitBtn").click(function(){
  let client = $("#clientSelect").val();
  if (!client) {
    alert("Please select a client first!");
    return;
  }

  // Collect data (optional, you can process/save it here)
  let entries = [];
  $(".entry-card").each(function(){
    entries.push({
      platform: $(this).find(".platform").val(),
      likes: $(this).find(".likes").val(),
      shares: $(this).find(".shares").val(),
      forwards: $(this).find(".forwards").val(),
      reach: $(this).find(".reach").val(),
      followers: $(this).find(".followers").val(),
    });
  });

  if (entries.length === 0) {
    alert("No entries found!");
    return;
  }

  // Show success toast
  const toastEl = document.createElement('div');
  toastEl.className = 'toast align-items-center text-bg-success border-0';
  toastEl.setAttribute('role', 'alert');
  toastEl.setAttribute('aria-live', 'assertive');
  toastEl.setAttribute('aria-atomic', 'true');
  toastEl.innerHTML = `
    <div class="d-flex">
      <div class="toast-body">
        ✔ Report submitted successfully for ${client}!
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
  `;
  $("#toastContainer").append(toastEl);
  const toast = new bootstrap.Toast(toastEl, { delay: 3000 });
  toast.show();
  toastEl.addEventListener('hidden.bs.toast', () => toastEl.remove());

  // Optional: Reset form after submission
  $("#clientSelect").val("");
  $(".entry-card").find("input[type=number]").val(0);
});
</script>
</body>
</html>
