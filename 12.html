<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Daily Client Worksheet</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<style>
  body { background:#f4f6f9; }
  .card { border-radius:20px; }
  .modal-content { border-radius:20px; }
</style>
</head>
<body class="p-4">
<div class="container">
  <div class="card shadow p-4">
    <h2 class="mb-3">Daily Client Worksheet</h2>
    <table class="table table-bordered align-middle" id="worksheetTable">
      <thead class="table-dark">
        <tr>
          <th>Date</th>
          <th>Time</th>
          <th>Call</th>
          <th>Content</th>
          <th>Type</th>
          <th>Notes</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <button class="btn btn-primary" id="addRow">+ Add Row</button>
    <button class="btn btn-success float-end" id="submitBtn">Submit</button>
  </div>
</div>

<!-- Submit Modal -->
<div class="modal fade" id="submitModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content p-3">
      <div class="modal-header">
        <h5 class="modal-title">Submission Summary</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="summaryContent"></div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
function todayDate(){ return new Date().toISOString().slice(0,10); }

function addRow(){
  const row = `
    <tr>
      <td><input type="date" class="form-control date" value="${todayDate()}"></td>
      <td>
        <div class="input-group">
          <input type="number" class="form-control hour" min="1" max="12" value="9">
          <input type="number" class="form-control minute" min="0" max="59" value="00">
          <select class="form-select ampm">
            <option>AM</option>
            <option>PM</option>
          </select>
        </div>
      </td>
      <td><input type="text" class="form-control call" placeholder="Call"></td>
      <td><input type="text" class="form-control content" placeholder="Content"></td>
      <td>
        <select class="form-select type">
          <option>Poster</option>
          <option>Video</option>
          <option>Banner</option>
          <option>Flyer</option>
          <option>Social Post</option>
          <option>Other</option>
        </select>
      </td>
      <td><textarea class="form-control notes" rows="1"></textarea></td>
      <td><button class="btn btn-danger btn-sm removeRow">X</button></td>
    </tr>`;
  $("#worksheetTable tbody").append(row);
}

$(document).on("click", "#addRow", function(){ addRow(); });
$(document).on("click", ".removeRow", function(){ $(this).closest("tr").remove(); });

$(document).on("click", "#submitBtn", function(){
  let data = [];
  $("#worksheetTable tbody tr").each(function(){
    let row = {
      date: $(this).find('.date').val(),
      time: $(this).find('.hour').val() + ':' + $(this).find('.minute').val() + ' ' + $(this).find('.ampm').val(),
      call: $(this).find('.call').val(),
      content: $(this).find('.content').val(),
      type: $(this).find('.type').val(),
      notes: $(this).find('.notes').val()
    };
    data.push(row);
  });

  let summaryHTML = `<h4>Advanced Summary</h4><ul class='list-group'>`;
  data.forEach((d,i)=>{
    summaryHTML += `<li class='list-group-item'>
      <strong>Row ${i+1}</strong><br>
      Date: ${d.date}<br>
      Time: ${d.time}<br>
      Call: ${d.call}<br>
      Content: ${d.content}<br>
      Type: ${d.type}<br>
      Notes: ${d.notes}
    </li>`;
  });
  summaryHTML += `</ul>`;

  $("#summaryContent").html(summaryHTML);
  new bootstrap.Modal(document.getElementById('submitModal')).show();
});

// Initial row
addRow();
</script>
</body>
</html>
